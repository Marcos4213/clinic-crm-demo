<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Automatize</title></head>
<body style="font-family:system-ui;padding:24px">Conectando o WhatsApp...
<script>
(function () {
  var p = new URLSearchParams(window.location.search)
  var msg = { type: 'META_OAUTH_CALLBACK', code: p.get('code') || '', state: p.get('state') || '', error: p.get('error') || '' }
  if (window.opener) {
    window.opener.postMessage(msg, window.location.origin)
    setTimeout(function () { window.close() }, 300)
  } else {
    document.body.textContent = 'Pode fechar esta janela e voltar ao Automatize.'
  }
})()
</script>
</body></html>
